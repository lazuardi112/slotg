<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        #login, #dashboard { max-width: 1000px; margin: 0 auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        #dashboard { display: none; }
        input[type="text"], input[type="password"], input[type="number"] { padding: 8px; margin: 5px 0 15px; width: 200px; }
        button { padding: 10px 15px; cursor: pointer; }
        h1, h2 { border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .section { margin-bottom: 20px; }
        #user-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        #user-table th, #user-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        #user-table th { background-color: #f2f2f2; }
        #user-table input { width: 100px; }
        #user-table button { padding: 5px 10px; }
    </style>
</head>
<body>

    <div id="login">
        <h1>Admin Login</h1>
        <input type="text" id="username" placeholder="Username" value="admin">
        <input type="password" id="password" placeholder="Password" value="password">
        <button id="login-btn">Login</button>
    </div>

    <div id="dashboard">
        <button id="logout-btn" style="float: right;">Logout</button>
        <h1>Admin Dashboard</h1>

        <div class="section">
            <h2>Global Settings</h2>
            <label for="global-rtp">Global RTP (%):</label>
            <input type="number" id="global-rtp" placeholder="e.g., 95">
            <button id="save-global-rtp">Save Global RTP</button>
        </div>

        <div class="section">
            <h2>User Management</h2>
            <table id="user-table">
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Credits</th>
                        <th>User RTP (%)</th>
                        <th>Update Credits</th>
                        <th>Update RTP</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- User data will be populated here -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/jquery-3.2.1.min.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>
