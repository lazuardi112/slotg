    <body ondragstart="return false;" ondrop="return false;">
	<div style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%"></div>
          <script>
              
            $(document).ready(function(){
                     var oMain = new CMain({
                                    start_credit: 10000,          // User's starting credit. Will be overwritten by server data.
                                    min_reel_loop: 1,           // Minimum number of reel loops before stopping.
                                    reel_delay: 4,              // Frames to delay reels after the first one.
                                    time_show_win: 2000,        // Duration of the win combo showing.
                                    time_show_all_wins: 2000,   // Duration of all win combos.
                                    check_orientation: true,    // Show orientation alert on mobile.
                                    audio_enable_on_startup: false, // Audio disabled on startup.
                                    show_credits: true,         // Show credits button.
                                    num_spin_for_ads: 20        // Spins before showing an ad.
                                });

                    // Overwrite coin bet values
                    COIN_BET = [5000, 10000, 25000, 50000, 100000, 250000, 500000, 1000000];
                    START_BET = COIN_BET[0];

                    $(oMain).on("bet_placed", function(evt, oData) {
                        $.ajax({
                            url: '/api/spin',
                            type: 'POST',
                            contentType: 'application/json',
                            data: JSON.stringify({
                                userId: s_oMain.deviceId,
                                bet: oData.tot_bet
                            }),
                            success: function(data) {
                                // The backend now controls the win logic.
                                // We need a function in CGame to accept this server response.
                                // For now, let's just update the credits and log the result.
                                TOTAL_MONEY = data.credits;

                                // s_oGame.onSpinReceived(data); // This function needs to be adapted or created
                                console.log("Spin Result:", data);

                                // A simplified win display for now
                                if(data.win) {
                                    s_oGame.showWin(data.winAmount);
                                } else {
                                    s_oGame.showLoss();
                                }
                            },
                            error: function(err) {
                                console.error("Spin failed:", err);
                                s_oGame.showError(err.responseJSON ? err.responseJSON.error : "Connection error");
                            }
                        });
                    });
                    
                    $(oMain).on("bonus_call",function(evt,oData){
                        var fCoin = oData.bet;
                        apiAttemptBonus(fCoin,s_oGame.onBonusStart,s_oGame);
                    });
                    
                    $(oMain).on("recharge", function(evt) {
                        //INSERT HERE YOUR RECHARGE SCRIPT THAT RETURN MONEY TO RECHARGE
                        var iMoney = START_MONEY;

                        refreshCredit(iMoney,s_oGame.refreshMoney,s_oGame);
                    });
                    
                    $(oMain).on("start_session", function(evt) {
                            if(getParamValue('ctl-arcade') === "true"){
                                parent.__ctlArcadeStartSession();
                            }
                            //...ADD YOUR CODE HERE EVENTUALLY
                    });
   
                    $(oMain).on("end_session", function(evt) {
                           if(getParamValue('ctl-arcade') === "true"){
                               parent.__ctlArcadeEndSession();
                           }
                           //...ADD YOUR CODE HERE EVENTUALLY
                    });

                    $(oMain).on("save_score", function(evt,iScore) {
                           if(getParamValue('ctl-arcade') === "true"){
                               parent.__ctlArcadeSaveScore({score:iScore});
                           }
                           //...ADD YOUR CODE HERE EVENTUALLY
                    });

                    
                    $(oMain).on("show_interlevel_ad", function(evt) {
                           if(getParamValue('ctl-arcade') === "true"){
                               parent.__ctlArcadeShowInterlevelAD();
                           }
                           //...ADD YOUR CODE HERE EVENTUALLY
                    });
                   
                    
                    if(isIOS()){
                        setTimeout(function(){sizeHandler();},200); 
                    }else{ 
                        sizeHandler(); 
                    }
           });

        </script>
